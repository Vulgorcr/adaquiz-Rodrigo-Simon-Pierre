<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAQUIZ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
     <section id="ecran-accueil" class="ecran">
     <div class="container">
     <header>
          <h1>ADAQUIZ</h1>
          <p>Connaissances générales</p> 
     </header>
          <section>
          <ul>
               <li><span>&#128165;</span>10 questions <span>&#128165;</span></li>
               <li><span>&#128165;</span>Choix multiples<span>&#128165;</span></li>
               <li><span>&#128165;</span>1 point par question<span>&#128165;</span></li>
          </ul>
          
          <img src="https://media1.tenor.com/m/_oZAe8NmTTwAAAAC/ta.gif" alt="Jogo" width="200">
          <button id= "btn-jouer" type= "button">JOUER</button>
     </div>
     </section>

 
  <section id="ecran-question" class="ecran cache">
     <div class="container"> 
          <p class="compteur" id="compteur-question">Question 1 / 10</p> 
          <h1>AdaQuiz</h1>

        <progress id="progression" value="1" max="10"></progress>
        <!-- <div id="progression" value="1" max="10"></div> -->
          <img id="image-question" class="cache" src="" alt="">

        <h2 id="texte-question"></h2>

        <div id="liste-reponses"></div>

        <p id="feedback-reponse" aria-live="polite"></p>

        <button id="btn-suivant" class="cache" type="button">Question suivante</button>
    </div>
</section>
    <!-- Section for displaying quiz questions dynamically -->

  <section id="ecran-resultats" class="ecran cache" aria-labelledby="titre-resultats">
     <header class ="header-resultats">
          <h1 id="titre-resultats">FIN DU QUIZ</h1>
     </header>

     <main class="contenu-resultats">

     <section class ="introduction-resultats">
          <p id="felicitation">Bravo ! Tu es allé au bout !</p>
     </section>

    <section class="carte-resultats">
          <p>Score final</p>
          <p id="score">.../10</p>
          <p id="message-reussi" aria-live="polite">Bravo, bien joué! &#127881;</p> 
          <p id="message-echec" aria-live="polite">Désolé, tu pourras faire mieux la prochaine fois ! &#128543;</p>
     </section>
     <section class ="actions-resultats">
          <button id="btn-rejouer" type="button">REJOUER</button> 
     </section>
</main>

<script src="questions.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
