<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdaQuiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
     <H1>Quiz Culture Generale</H1>

  <!-- ═══════════════════════════════════════
       ÉCRAN 1 — ACCUEIL
       Affiché au départ. Caché quand on clique sur "Commencer".
  ════════════════════════════════════════ -->
  <section id="ecran-accueil" class="ecran">

  </section>

  <!-- ═══════════════════════════════════════
       ÉCRAN 2 — QUESTION
       Caché au départ. Affiché pendant le quiz.
  ════════════════════════════════════════ -->
  <section id="ecran-question" class="ecran cache">

  </section>

  <!-- ═══════════════════════════════════════
       ÉCRAN 3 — RÉSULTATS
       Caché au départ. Affiché à la fin du quiz.
  ════════════════════════════════════════ -->
  <section id="ecran-resultats" class="ecran cache" aria-labelledby="titre-result">
     <header class= "header-resultats">
          <h1 id="titre-resultats">FIN DU QUIZ</h1>
     </header>

     <main class="contenu-resultats">

     <section class ="introduction-resultats">
          <p id="felicitation">Bravo ! Tu es allé au bout du quiz ! J'espère que tu t'es amusé</p>
     </section>

    <section class="carte-resultats">
          <h2>Score final</h2>
          <p id="score">.../10</p>
          <p id="message-fin" aria-live="polite">Quiz réussi !</p> 
          <p id="message-fin" aria-live="polite">Désolé tu n'a pas atteint le score</p>
     </section>
     <section class ="actions-resultats">
          <button id="btn-rejouer" type="button">REJOUER</button> 
     </section>
</main>
  <script src="script.js" defer></script>
</body>

</html>
