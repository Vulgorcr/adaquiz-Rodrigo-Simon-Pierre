<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAQUIZ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
     <section id="ecran-accueil" class="ecran">
     <div class="container">
     <header>
          <H1>ADAQUIZ</H1>
          <p>Culture Générale</p>
     </header>
          <section>
          <ul>
               <li><span>&#128165</span>10 questions <span>&#128165</span></li>
               <li><span>&#128165</span>Multiples choix<span>&#128165</span></li>
               <li><span>&#128165</span>1 point par question<span>&#128165</span></li>
          </ul>
          <h2>Testez vos connaissances générales !</h2>
          <img src="https://media1.tenor.com/m/_oZAe8NmTTwAAAAC/ta.gif" alt="Jogo" width="200">
          <button id= "btn-jouer" type= "button">JOUER</button>

     </section>

 
  <section id="ecran-question" class="ecran cache">

  </section>

 
  <section id="ecran-resultats" aria-labelledby="titre-resultats">
     <header class ="header-resultats">
          <h1 id="titre-resultats">FIN DU QUIZ</h1>
     </header>

     <main class="contenu-resultats">

     <section class ="introduction-resultats">
          <p id="felicitation">Bravo ! Tu es allé au bout !</p>
     </section>

    <section class="carte-resultats">
          <p>Score final</p>
          <p id="score">.../10</p>
          <p id="message-reussi" aria-live="polite">Quiz réussi ! &#127881;</p> 
          <p id="message-echec" aria-live="polite">Désolé tu n'a pas atteint le score &#128543;</p>
     </section>
     <section class ="actions-resultats">
          <button id="btn-rejouer" type="button">REJOUER</button> 
     </section>
</main>
  <script src="script.js" defer></script>
</body>
</div>

</html>
